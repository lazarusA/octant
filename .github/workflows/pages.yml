name: Deploy WebAssembly Site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/cjk_slices -> target

      - name: Download & Install Trunk
        env:
          # Pinned: trunk (and the wasm-opt it downloads) change the output size.
          TRUNK_VERSION: "0.21.14"
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /usr/local/bin
          chmod +x /usr/local/bin/trunk

      - name: Build Web Application
        run: trunk build --release --public-url /octant/

      # Slices of the Noto CJK fonts for Chinese, Japanese and Korean text in
      # datasets (about 18 MB, fetched by the page only as needed). Built here
      # instead of committed; the tool does not compile Octant itself.
      # The pinned upstream fonts, downloaded once per pin change.
      - uses: actions/cache@v4
        with:
          path: target/subset_fonts
          key: noto-cjk-${{ hashFiles('src/bin/subset_fonts/pins.rs') }}

      - name: Build CJK font slices
        run: cargo run --release --manifest-path tools/cjk_slices/Cargo.toml -- dist/fonts/cjk

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
