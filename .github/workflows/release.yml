name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"

  build-binaries:
    name: Build Release Binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: octant-linux-x86_64.tar.gz
            archive_cmd: tar -czf octant-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-gnu/release octant
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: octant-macos-arm64.tar.gz
            archive_cmd: tar -czf octant-macos-arm64.tar.gz -C target/aarch64-apple-darwin/release octant
          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: octant-macos-x86_64.tar.gz
            archive_cmd: tar -czf octant-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release octant
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: octant-windows-x86_64.zip
            archive_cmd: 7z a octant-windows-x86_64.zip target/x86_64-pc-windows-msvc/release/octant.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create release archive
        run: ${{ matrix.archive_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-crates-io, build-binaries]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
