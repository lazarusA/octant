name: Release

on:
  push:
    tags:
      - 'v*'
  # Builds the installers without releasing: they are kept as the run's artifacts.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-crates-io:
    name: Publish to crates.io
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev libhdf5-dev libasound2-dev

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --token "$CARGO_REGISTRY_TOKEN"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish-crates-io]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # Every installer cargo-packager makes on each OS (see [package.metadata.packager] in
  # Cargo.toml), attached to the release; each carries the license notices.
  installers:
    name: Installers (${{ matrix.os }})
    needs: [github-release]
    if: always() && (needs.github-release.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the AppImage needs a glibc no newer than the systems it runs on.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev libhdf5-dev libasound2-dev

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@0.11.8

      - name: Build installers
        run: cargo packager --release --formats all
        env:
          # Windows: the C runtime linked into the .exe, so installs need no Visual C++
          # redistributable. Release builds only, as the C libraries' CMake builds may not follow.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          # The C libraries' CMake builds pick their runtime from this file, not from crt-static
          # (read by the cmake crate for this target only).
          CMAKE_TOOLCHAIN_FILE_x86_64_pc_windows_msvc: ${{ github.workspace }}/packaging/windows/static-crt.cmake

      - name: Check the binary links netCDF, HDF5 and the C runtime in
        shell: bash
        run: scripts/check_linkage.sh

      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          ditto -c -k --keepParent target/release/Octant.app "target/release/Octant_${version}_aarch64.app.zip"

      - name: Collect the installers
        shell: bash
        run: |
          mkdir dist
          shopt -s nullglob
          cp target/release/{*.dmg,*.app.zip,*.msi,*-setup.exe,*.deb,*.AppImage,*.tar.gz,PKGBUIL[D]} dist/
          ls dist

      - name: Attach to the release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

      - name: Keep as run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/*
