name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Linux, macOS, Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev libhdf5-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test

  fmt:
    name: Code Formatting (cargo fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check formatting (CJK slice tool)
        run: cargo fmt --manifest-path tools/cjk_slices/Cargo.toml -- --check

  clippy:
    name: Linting (cargo clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev libhdf5-dev libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools/cjk_slices -> target
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Clippy (font subset tool)
        run: cargo clippy --features font-tools --bin subset_fonts -- -D warnings
      - name: Run Clippy and tests (CJK slice tool)
        run: |
          cargo clippy --manifest-path tools/cjk_slices/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path tools/cjk_slices/Cargo.toml
      # The pinned upstream fonts, downloaded once per pin change.
      - uses: actions/cache@v4
        with:
          path: target/subset_fonts
          key: noto-cjk-${{ hashFiles('src/bin/subset_fonts/pins.rs') }}
      # Builds the web font slices the way pages.yml does, so a broken pin or
      # slicer fails here rather than at deploy time.
      - name: Build CJK font slices
        run: cargo run --release --manifest-path tools/cjk_slices/Cargo.toml -- target/cjk_slices_check

  licenses:
    name: Third-party License Notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Check THIRD_PARTY_LICENSES.md is up to date
        run: |
          scripts/third_party_licenses.sh
          git diff --exit-code -- assets/licenses/THIRD_PARTY_LICENSES.md || {
            echo "::error::Dependencies changed: run 'scripts/third_party_licenses.sh' and commit the result."
            exit 1
          }

  wasm:
    name: WebAssembly Trunk Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Download & Install Trunk
        env:
          # Pinned: trunk (and the wasm-opt it downloads) change the output size.
          TRUNK_VERSION: "0.21.14"
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C /usr/local/bin
          chmod +x /usr/local/bin/trunk
      - name: Build Web Application
        run: trunk build --release --public-url /octant/
      - name: Install brotli
        run: sudo apt-get update && sudo apt-get install -y brotli
      - name: Check wasm size budget
        run: |
          scripts/check_wasm_size.sh dist .github/wasm-size-budget
          scripts/check_wasm_size.sh dist .github/wasm-size-budget-voice-worker voice_worker_bg.wasm
