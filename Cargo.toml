[package]
name = "octant"
version = "0.2.6"
default-run = "octant"
authors = ["Lazaro Alonso <lazarus.alon@gmail.com>"]
edition = "2024"
description = "An interactive viewer for N-dimensional datasets, stored locally or in cloud object storage. Built in Rust with GPU rendering, available on desktop and in the browser."
readme = "README.md"
repository = "https://github.com/lazarusA/octant"
documentation = "https://docs.rs/octant"
license = "MIT OR Apache-2.0"
keywords = ["visualization", "zarr", "icechunk", "wgpu", "graphics"]
categories = ["visualization", "graphics", "science"]
exclude = [
    ".agents/",
    ".github/",
    "assets/octant_tas.png",
    "assets/coastlines/coastline_50m.bin",
    "assets/coastlines/coastline_10m.bin",
    "AGENTS.md",
    "ARCHITECTURE.md",
]

[dependencies]
egui = { version = "0.37.0", features = ["default_fonts"] }
eframe = { version = "0.37.0", features = ["persistence", "wgpu"] }
wgpu = { version = "30.0.1", features = ["webgpu", "webgl"] }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.33", features = ["bytemuck"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
flate2 = "1.0"
inventory = "0.3"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
web-time = "1.1"
blusc = "0.0.6"
ruzstd = "0.9"
zarrs_metadata = "0.7"
zarrs_codec = "0.2"
zarrs_plugin = "0.4"
bytes = "1.12"
async-trait = "0.1"
half = "2.4"
weezl = "0.2"
# Capped GeoTIFF Zstd tiles (the version async-tiff already builds on every target).
zstd = "0.14"
# OME-Zarr (NGFF) metadata: images, labels, plates and bioformats2raw series.
ome_zarr_metadata = { version = "0.3.1", default-features = false }
# Series names from `OME/METADATA.ome.xml` (same version object_store uses).
quick-xml = "0.41"

icechunk-format = { version = "2.1.2", default-features = false }
icechunk-types = { version = "2.1.2", default-features = false }
colorgrad = { version = "0.9", default-features = false, features = ["std", "named-colors"] }
# Coordinate reference systems: proj strings (`data/crs/`).
proj4rs = { version = "0.2.1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53", features = ["full"] }
env_logger = "0.11"
arboard = "3.4"
netcdf = { version = "0.12", features = ["static"] }
rayon = "1.10"
reqwest = { version = "0.13", features = ["blocking", "json"] }
md-5 = "0.11"
sys-locale = "0.3"
# System fonts for characters no loaded font draws, asked for the Han font's
# locale (`ui/fonts/system_provider.rs`); eframe's own instance is turned off.
egui_system_font_provider = "0.37.0"
# Only for `cargo run --features font-tools --bin subset_fonts`.
allsorts = { version = "0.17", default-features = false, features = ["flate2_rust"], optional = true }
crc32fast = "1.5"
zarrs = { version = "0.23", features = ["blosc", "zstd", "sharding", "gzip", "zlib", "crc32c", "async", "filesystem", "pcodec"] }
zarrs_object_store = { version = "0.7", features = ["http"] }
zarrs_icechunk = "0.5"
icechunk = "2.1.2"
object_store = { version = "0.14", features = ["http", "aws", "azure", "gcp"] }
async-tiff = { version = "0.4.0", features = ["object_store", "reqwest", "tokio"] }
# EPSG codes to proj strings on the desktop; the web fetches them on first use.
crs-definitions = { version = "0.6", default-features = false, features = ["proj4"] }
# WKT without an EPSG code to proj strings; its wasm build exports a `main`.
proj4wkt = "0.1.1"
cpal = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.1"
uuid = { version = "1", features = ["v4", "js"] }
zarrs = { version = "0.23", default-features = false, features = ["ndarray", "crc32c", "gzip", "zlib", "sharding", "transpose", "async", "bitround", "pcodec"] }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Response", "Request", "RequestInit", "Headers", "RequestMode", "AbortController", "AbortSignal", "Navigator", "MediaDevices", "MediaStream", "MediaStreamTrack", "MediaStreamConstraints", "AudioContext", "BaseAudioContext", "AudioNode", "AudioDestinationNode", "MediaStreamAudioSourceNode", "ScriptProcessorNode", "AudioProcessingEvent", "AudioBuffer"] }
js-sys = "0.3"
sys-locale = { version = "0.3", features = ["js"] }
blusc = "0.0.6"
getrandom = { version = "0.4", features = ["wasm_js"] }
async-tiff = { version = "0.4.0", default-features = false }

[features]
# Build tools that regenerate bundled assets (never needed to build Octant).
font-tools = ["dep:allsorts"]

[[bin]]
name = "subset_fonts"
path = "src/bin/subset_fonts/main.rs"
required-features = ["font-tools"]

[dev-dependencies]
blusc = "0.0.6"
# Checks that the bundled CJK subsets cover their translations.
skrifa = "0.44"

[patch.crates-io]
blusc = { git = "https://github.com/lazarusA/blusc", branch = "la/fix_linker" }

# Shipped builds (desktop and `trunk build --release`): full speed (opt-level 3),
# optimized across crates, without symbols. Debug builds and tests are unaffected.
[profile.release]
lto = true
codegen-units = 1
strip = true
