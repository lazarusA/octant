[package]
name = "octant"
version = "0.1.0"
edition = "2024"
description = "A minimalist, multiscale cloud-native tensor visualization engine in Rust."

[dependencies]
egui = "0.29"
eframe = { version = "0.29", features = ["wgpu"] }
wgpu = { version = "22.1", features = ["webgpu", "webgl"] }
bytemuck = { version = "1.16", features = ["derive"] }
glam = { version = "0.27", features = ["bytemuck"] }
log = "0.4"
zarrs = { version = "0.23", features = ["blosc", "async"] }
zarrs_object_store = { version = "0.7", features = ["http"] }
zarrs_icechunk = "0.5"
icechunk = "2.1.2"
object_store = { version = "0.14", features = ["http", "aws", "azure", "gcp"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.38", features = ["full"] }
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1.0"
