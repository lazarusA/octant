<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Octant — High-Performance Scientific Tensor Visualizer</title>
    <link data-trunk rel="rust" data-bin="octant" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #octant_canvas_anchor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        #loading_screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            z-index: 10;
            transition: opacity 0.4s ease-out;
            pointer-events: none;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(56, 139, 253, 0.2);
            border-top: 3px solid #58a6ff;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 18px;
        }

        .loading-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #c9d1d9;
        }

        .loading-subtitle {
            font-size: 12px;
            color: #8b949e;
            margin-top: 6px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading_screen">
        <div class="spinner"></div>
        <div class="loading-title">OCTANT ENGINE</div>
        <div class="loading-subtitle">Initializing WebGPU / WebGL2 Context...</div>
    </div>
    <canvas id="octant_canvas_anchor"></canvas>
    <script>
        // Observe canvas or animation loop to fade out loading screen
        const hideLoading = () => {
            const el = document.getElementById('loading_screen');
            if (el) {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 400);
            }
        };
        // Fallback timer if canvas frame event doesn't trigger immediately
        window.addEventListener('load', () => {
            setTimeout(hideLoading, 1500);
        });
    </script>
</body>
</html>
